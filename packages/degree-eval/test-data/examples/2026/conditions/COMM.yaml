courses:
  COMM3090:
    original: >-
      Students are expected to be in their final year of a Bachelor of Commerce single or dual degree
      with at least 108 UOC completed.
    status: parsed
    # Maturity-style UOC prerequisite plus a program-group test (replaces title-keyword "COMM#").
    requires: program(@bcom) and uoc(108)
    note: >-
      0 UOC Final Year Synthesis by application for significant extra-curricular projects (e.g. Peter
      Farrell Cup); offered in limited circumstances.
