# Conformance fixture (SCHEMA.md §15). Review B1: a BSc with a science minor must not lose its real free
# electives to secondary credit, and the science total must count the minor's science courses once.
fixture_version: "1.0"
id: b1-3970-science-minor
findings: [B1]
title: 3970 BSc, 48 UOC science major + MATHC2 minor + 30 UOC non-science free electives
description: >-
  The reviewer's B1 counterexample. Under the first draft, MATHC2's 36 UOC was credited to free-electives
  as well, filling its 36 UOC cap, so the 30 UOC of real free electives became "not counted" and the
  program showed unmet at 114 UOC. Under §7.4 (primary allocation first; counts_toward credit only into
  headroom and only for `not @science` courses) every course is counted once and the plan is complete.
