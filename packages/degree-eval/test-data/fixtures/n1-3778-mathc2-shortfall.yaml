# Conformance fixture (SCHEMA.md §15). REVIEW-2 N1, other direction: an unknown child must not hide a
# real UOC shortfall in the same spec. Variant of m1-3778-mathc2.
fixture_version: "1.0"
id: n1-3778-mathc2-shortfall
findings: [N1]
title: 3778 BCompSc + MATHC2 stand-in whose electives cover only 18 of the minor's 36 UOC
description: >-
  As m1-3778-mathc2, COMPA1 takes MATH1131/MATH1231 and MATHC2's level-1 core is unknown
  (overlap_undeclared). The MATHC2 here is a synthetic stand-in whose electives pool needs only 18 UOC
  while the spec still needs 36, and the plan has 18 UOC of MATH electives (MATH2121 is replaced by a
  real free elective, ECON1102). Every child of the minor is met or unknown, but its uoc check is
  unmet: 18 counted + 12 blocked = 30 < 36 (SCHEMA.md §7.6). A table that ignored the uoc condition
  would report unknown; the Kleene AND reports unmet, and so the root is unmet even though its total
  is 144.
