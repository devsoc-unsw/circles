      spec_kind: minor
      uoc: 36
      provenance: { source: local, note: "Synthetic stand-in; NOT the handbook MATHC2 structure (the real electives pool needs 24 UOC)." }
      requirements:
        - { id: level-1-core, kind: core, uoc: 12, courses: [MATH1131 or MATH1141, MATH1231 or MATH1241] }
        - id: electives
          kind: pool
          uoc: { min: 18 }
          from: [MATH2011, MATH2121, MATH2501, MATH3411]
          quotas:
            - { from: MATH3*** or MATH6***, uoc: { min: 6 } }
