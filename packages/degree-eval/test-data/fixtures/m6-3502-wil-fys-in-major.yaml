# Conformance fixture (SCHEMA.md §15). Review M6 (and minor 3): one WIL/FYS course inside the major, as
# the handbook endorses, plus the additional elective the handbook asks for.
fixture_version: "1.0"
id: m6-3502-wil-fys-in-major
findings: [M6, m3]
title: 3502 BCom, FINSA1 with COMM3030 counted as major elective, WIL and FYS
description: >-
  COMM3030 is primary in FINSA1's prescribed electives and is shared (secondary) into the WIL and FYS
  pools. The Disciplinary Component then holds IFY 48 + FINSA1 42 (non-IFY) = 90 UOC, and the extra
  elective the handbook requires is counted by overlap-replacement-elective, giving 96. The extra
  course chosen by exact top-up is the earliest eligible one (ARTS2090); the Business-UOC rule is met
  at program scope by ACCT2511 in free electives. COMM1180 is shared between IFY and FINSA1 within the
  6 UOC budget.
