# Conformance fixture (SCHEMA.md §15). REVIEW-2 N5: exact pool fill when the minimum cannot be hit
# exactly, or when a count minimum forces overshoot. The DP must keep the exact UOC above the minimum.
fixture_version: "1.0"
id: n5-overshoot
findings: [N5, M5]
title: Overshoot in exact pool fill (synthetic program)
description: >-
  Pool A needs at least 30 UOC; its candidates in canonical order are 6, 6, 6, 4, 4, 6, 6. A greedy
  fill takes 6+6+6+4+4 = 26 and then 6, for 32 UOC in six courses. The step 2 order prefers the five
  6 UOC courses (30 UOC; criterion 4, smallest total UOC), so both 4 UOC courses go to free electives.
  Pool B needs at least 30 UOC and at least 6 courses; its candidates are 6, 6, 6, 6, 6, 4, 4. Every
  admissible set overshoots. Four 6s + both 4s give 32 UOC; five 6s + one 4 give 34. Criterion 4 picks
  32. A DP whose UOC dimension is capped at the minimum (30) sees both as 30 and, with equal counts,
  falls through to criterion 7, picking the lexicographically smaller indices [0,1,2,3,4,5] = 34 UOC.
  Greedy also gives 34 (five 6s, then a 4 for the count).
