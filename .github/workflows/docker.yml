name: Docker
on:
  push:
    branches:
      - dev
      - staging

env:
  ENVIRONMENT: ${{ github.ref_name == 'dev' && 'prod' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'dev' && 'circles' || 'circles-staging' }}

jobs:
  build:
    name: "Build (${{ matrix.component }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
        include:
          - component: frontend
            dockerfile: production.dockerfile
            args: |
              "API_URL=https://circlesapi.devsoc.app"
          - component: backend
            dockerfile: production.dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          platforms: linux/amd64
          file: ${{ matrix.component }}/${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME}}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME}}-${{ matrix.component }}:latest
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency: production
    environment: production
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: devsoc-unsw/deployment
          token: ${{ secrets.GH_TOKEN }}
          ref: dev
      - name: Install yq - portable yaml processor
        uses: mikefarah/yq@v4.35.2
      - name: Update deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "CSESoc CD"
          git config user.email "technical@csesoc.org.au"
          git checkout -b update/${{ env.IMAGE_NAME }}/${{ github.sha }}
          yq -i '.items[0].spec.template.spec.containers[0].image = "ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}"' projects/circles/${{ env.ENVIRONMENT }}/deploy-frontend.yml
          yq -i '.items[0].spec.template.spec.containers[0].image = "ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}"' projects/circles/${{ env.ENVIRONMENT }}/deploy-backend.yml
          git add . 
          git commit -m "feat(${{ env.IMAGE_NAME }}): update images" 
          git push -u origin update/${{ env.IMAGE_NAME }}/${{ github.sha }}
          gh pr create -B dev --title "feat(${{ env.IMAGE_NAME }}): update image" --body "Updates the image for the ${{ env.IMAGE_NAME }} deployment to commit devsoc-unsw/${{ env.IMAGE_NAME }}@${{ github.sha }}." > URL
          gh pr merge $(cat URL) --squash -d
