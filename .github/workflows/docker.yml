name: Docker
on:
  push:
    branches:
      - dev
      - staging

env:
  ENVIRONMENT: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'dev' && 'circles' || 'circles-staging' }}

jobs:
  build:
    name: "Build (${{ matrix.component }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
        include:
          - component: frontend
            dockerfile: production.dockerfile
            args: |
              "API_URL=${{ github.ref_name == 'dev' && 'https://circlesapi.devsoc.app' || 'https://circles-staging-api.devsoc.app' }}"
          - component: backend
            dockerfile: production.dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging') }}
          platforms: linux/amd64
          file: ${{ matrix.component }}/${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME}}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME}}-${{ matrix.component }}:latest
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}
    environment: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging') }}

    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@main
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-frontend=${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend=${{ github.sha }}
