# 4056 Bachelor of Education (Secondary), handbook year 2026
# Source: https://www.handbook.unsw.edu.au/undergraduate/programs/2026/4056
#   (curriculum structure 2026.02.094, accessed 2026-10-10)
# Lane C transcription. "This program is not available as a standalone degree"; written so that
# Education double degrees (e.g. 4053 Arts/Education (Secondary)) can import `disciplinary` (§8).
# Shows practicum rules: 0 UOC LANTITE "courses" with a before-rule, professional-experience
# eligibility based on teaching-area volume, a course that must be taken alone, and methods
# chosen in pairs by teaching area.
schema_version: "1.0"
kind: program
code: "4056"
year: 2026
title: Education (Secondary)
career: ugrd
uoc: 144
awards: [Bachelor of Education (Secondary)]
provenance:
  source: hand
  url: https://www.handbook.unsw.edu.au/undergraduate/programs/2026/4056
  structure_version: "2026.02.094"
  retrieved: 2026-10-10
  status: partial
  warnings:
    - >-
      Handbook discrepancy: the program record says 144 UOC, but the Disciplinary Component is 96 UOC,
      the description says "the equivalent of two years of full-time study", and there is no standalone
      enrolment. `uoc` keeps the handbook's 144; only the 96 UOC component is meaningful (as imported by
      double degrees).
    - Methods "in two areas of specialisation, taking 12 UOC per term" are info only (no teaching-area grouping in the data).

requirements:
  - id: disciplinary
    kind: group
    title: Disciplinary Component
    uoc: { min: 96 }
    original: You must complete 96 UOC of the following to satisfy the core requirements of this degree.
    children:
      - id: level-1-core
        kind: core
        title: Level 1 Core Courses
        uoc: 18
        courses: [EDST1003, EDST1101, EDST1104]
      - id: level-2-core
        kind: core
        title: Level 2 Core Courses
        uoc: 12
        courses: [EDST2002, EDST2009]
      - id: level-3-core
        kind: core
        title: Level 3 Core Courses
        uoc: 18
        courses: [EDST4080, EDST4084, EDST6760]
        original: >-
          You must take 18 UOC of the following courses: Note: In order to be eligible for EDST6760
          Professional Experience 1 students must have completed the prerequisite courses and
          participation and enrolment requirements for EDST6760, and sufficient subject content knowledge
          in their first and second teaching specialisations (methods areas). Typically, students will
          need to have completed 24 UOC in an appropriate minor (12 UOC at level 1 and 12 UOC at level 2
          or above), and a minimum of 24 UOC in an appropriate major (12 UOC at level 1 and 12 UOC at
          level 2 or above).
        note: >-
          The teaching-area volume rule refers to the major/minor of the partner degree, which this
          document does not contain. It is encoded in the double degree (4053 pe1-content-knowledge),
          where component paths reach the Arts specialisations.
      - id: level-4-core
        kind: core
        title: Level 4 Core Courses
        uoc: 18
        courses: [EDST4096, EDST6765]
        original: >-
          You must take 18 UOC of the following courses. Please note that EDST6765 cannot be studied
          concurrently with another course. Note: In order to be eligible for EDST6765 Professional
          Experience 2/Internship students must have completed the prerequisite courses and participation
          and enrolment requirements for EDST6765, and the appropriate subject content knowledge in their
          first and second teaching specialisations (methods areas). Typically, students will need to have
          completed 24 UOC in an appropriate minor (12 UOC at level 1 and 12 UOC at level 2 or above), and
          a minimum of 36 UOC in an appropriate major (maximum 12 UOC at level 1 and at least 12 UOC at
          level 3 or above).
      - id: edst6765-alone
        kind: info
        text: EDST6765 cannot be studied concurrently with another course.
        note: >-
          SCHEMA GAP: timing has `same_term` but no "alone in its term" form (e.g. `exclusive_term: true`:
          no other instance in the terms this course occupies).

      - id: professional-experience-plans
        kind: info
        title: Eligibility Requirements for Professional Experience
        text: >-
          The following programs require students to follow prescribed program plans in order to meet
          eligibility requirements for professional experience: 3462 Commerce/Education (Secondary), 4058
          Economics/Education (Secondary), 4067 Design/Education (Secondary), 4068 Fine Arts/Education
          (Secondary), 4076 Science/Education (Secondary). Refer to the relevant Sample Program.

      - id: lantite
        kind: core
        title: LANTITE
        uoc: 0
        courses: [EDST6600, EDST6601]
        original: >-
          Successful completion of the NESA Literacy and Numeracy Test for Initial Teacher Education
          Students (LANTITE) test will be recorded as two zero credit courses, EDST6600 LANTITE (Literacy)
          and EDST6601 LANTITE (Numeracy) on your academic record. You must attempt LANTITE in your first
          year of studies and successfully complete it before EDST2002.
      - id: lantite-before-edst2002
        kind: maturity
        applies_to: EDST2002
        require: EDST6600 and EDST6601
        original: successfully complete it before EDST2002
      - id: lantite-first-year
        kind: info
        text: You must attempt LANTITE in your first year of studies.
        note: SCHEMA GAP — "attempt in year 1" needs a plan-year timing form (and an attempt, not a pass).

      - id: methods
        kind: pool
        title: Prescribed Education Methods
        uoc: 24
        count: 4
        from: [EDST6700, EDST6701, EDST6702, EDST6704, EDST6705, EDST6706, EDST6711, EDST6714, EDST6715,
               EDST6716, EDST6717, EDST6718, EDST6719, EDST6722, EDST6723, EDST6725, EDST6726, EDST6727,
               EDST6728, EDST6730, EDST6731, EDST6732, EDST6734, EDST6735, EDST6736, EDST6741, EDST6744,
               EDST6745, EDST6746, EDST6747, EDST6748, EDST6749, EDST6752, EDST6753, EDST6755, EDST6756,
               EDST6757, EDST6758, EDST6771, EDST6772, EDST6775, EDST6776, EDST6777, EDST6778, EDST6788,
               EDST6789, EDST6790, EDST6791, EDST6792, EDST6793, EDST6920, EDST6921, EDST6922, EDST6923,
               EDST6924, EDST6925, EDST6926, EDST6927, EDST6950, EDST6951, EDST6952, EDST6953, EDST6954,
               EDST6955, EDST6956, EDST6957, EDST6958]
        original: >-
          You must take four single method courses in two areas of specialisation (24 UOC), taking 12 UOC
          per term.
        note: >-
          `from` is a list so double degrees can narrow it with list_remove. SCHEMA GAP: "in two areas of
          specialisation" needs the list partitioned into teaching areas and a "k courses from each of 2
          chosen areas" construct (a choose group over per-area pools would work if the handbook published
          the areas; it does not). "12 UOC per term" needs a per-term UOC timing form. See info methods-areas.
      - id: methods-areas
        kind: info
        text: >-
          You must take four single method courses in two areas of specialisation (24 UOC), taking 12 UOC
          per term.

      - id: prescribed-elective
        kind: pool
        title: Prescribed Elective
        uoc: 6
        from: EDST2032 or EDST2044 or EDST2070 or EDST2094
        original: "You must take 6 UOC of the following courses:"

  - id: professional-experience-days
    kind: info
    text: >-
      EDST2002, EDST6760 and EDST6765 provide students with a total of 80 days of professional experience
      in secondary schools and other educational settings, in at least two different secondary schools.
  - id: nesa-requirements
    kind: info
    confirm: true
    text: >-
      For accreditation as a teacher in NSW, all teacher education students will need to meet the
      Participation and Enrolment Requirements set by the NSW Education Standards Authority (NESA),
      including a Working with Children Check.
  - id: before-first-placement
    kind: info
    confirm: true
    text: >-
      Before going out to your first school placement, you will need to: undertake the Literacy and
      Numeracy Test for Initial Teacher Education (LANTITE); complete anaphylaxis training.
  - id: double-degree-only
    kind: info
    text: >-
      Note: This program is not available as a standalone degree. The UNSW BEd (Sec) can only be
      completed full-time or part-time as a double degree (the equivalent of two years of full-time
      study).
