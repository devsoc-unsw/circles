# 3586 Bachelor of Actuarial Studies, handbook year 2026
# Source: https://www.handbook.unsw.edu.au/undergraduate/programs/2026/3586
#   (curriculum structure 2026.05.034, accessed 2026-10-09; transcribed 2026-10-10 by Lane B)
schema_version: "1.0"
kind: program
code: "3586"
year: 2026
title: Actuarial Studies
career: ugrd
uoc: 144
duration_years: 3
awards: [Bachelor of Actuarial Studies]
provenance:
  source: hand
  url: https://www.handbook.unsw.edu.au/undergraduate/programs/2026/3586
  structure_version: "2026.05.034"
  retrieved: 2026-10-09
  status: partial
  warnings:
    - >-
      Overlap between the program core/electives and an optional Actuarial Studies major (ACTLE1 shares
      ACTL3142 and the ACTL3xxx electives) is not addressed by the handbook, so no share is declared;
      such overlaps evaluate as unknown (overlap_undeclared). "Students completing these majors will
      still need to complete the program requirements" suggests the courses are not meant to count
      twice, but the handbook does not say how a student satisfies ACTL3142 in both places; status is
      partial until this is confirmed.

sets:
  actl_l3_electives: ACTL3141 or ACTL3143 or ACTL3151 or ACTL3162 or ACTL3182 or ACTL3191 or ACTL3192 or ACTL3301

requirements:
  - id: disciplinary
    kind: group
    title: Disciplinary Component
    uoc: { min: 96 }
    original: Students must complete 96 UOC of the following to satisfy the core requirements of this degree
    children:
      - id: level-1-core
        kind: core
        title: Level 1 Core Courses
        uoc: 48
        courses: [ECON1101, ACTL1101, COMM1170, COMM1180, COMM1240, ECON1102, MATH1151, MATH1251]
        original: Students must take 48 UOC of the following courses.

      - id: level-2-core
        kind: core
        title: Level 2 Core Courses
        uoc: 24
        courses: [ACTL2102, ACTL2111, ACTL2131, COMM2501]
        original: >-
          Students must take 24 UOC of the following courses. Students may replace ACTL2131 with the two
          courses MATH2901 Higher Theory of Statistics and MATH2931 Higher Linear Models. If students make
          this replacement, MATH2901 will count towards ACTL2131, and MATH2931 will be counted towards a
          major where this course is required or as a Business elective.

      - id: level-3-core
        kind: core
        title: Level 3 Core Courses
        uoc: 6
        courses: [ACTL3142]

      - id: level-3-electives
        kind: pool
        title: Level 3 Actuarial Electives
        uoc: 18
        from: "@actl_l3_electives"
        original: Students must complete 18 UOC of the following courses.

      - id: maturity-level-2
        kind: maturity
        applies_to: level:2
        require: uoc(24)
        original: Students must have completed 24 UOC before taking any Level 2 courses.
      - id: maturity-level-3
        kind: maturity
        applies_to: level:3
        require: uoc(48)
        original: Students must have completed 48 UOC before taking any Level 3 courses.

  # "Optional Specialisations" (handbook container under the Disciplinary Component). Placed at the root,
  # as in 3502, so an optional spec cannot stand in for the 96 UOC Disciplinary Component; it uses
  # elective space instead (counts_toward credit).
  - id: actuarial-major
    kind: spec
    slot: major
    title: Actuarial Studies Majors (optional)
    options: [ACTLE1, COMPZ1, MATHE1]
    count: { min: 0, max: 1 }
    counts_toward: [free-electives, gen-ed]
    original: >-
      Students may complete one of the following optional majors in addition to their Actuarial Studies
      program requirements. Students completing these majors will still need to complete the program
      requirements such as Level 1 and 2 core course as well as Level 3 electives. These majors will
      require UOC to be taken from the Business Electives, Free Electives and/or General Education courses
      depending on a student's program rules and courses completed. It may also require completion of
      additional UOC above the minimum required for a student's program.

  - id: other-spec
    kind: spec
    slot: any
    title: Other Majors / Minors (optional)
    options: [ACCTA1, ACCTA2, CLIMB2, COMMG1, COMMG2, COMMI1, COMMI2, COMMJ1, COMMJ2, ECONF1, ECONF2,
              ECONJ1, ECONO1, ECONO2, FINSA1, FINSA2, FINSR1, FINSR2, IBUSA1, IBUSA2, INFSA1, INFSA2,
              INFSG1, INFSG2, MARKA1, MARKA2, MARKD1, MARKD2, MATHM1, MATHT1, MGMTA2, MGMTH1, MGMTH2,
              MGMTJ1, MGMTJ2, TABLC1]
    count: { min: 0, max: 1 }
    counts_toward: [free-electives, gen-ed]
    distinct_from: [{ node: actuarial-major }]
    original: >-
      Students may complete up to a maximum of one optional major/minor listed below in addition to their
      Actuarial Studies program requirements. Notes for Single-Degree students: Completion of one of the
      following non-Actuarial Studies Majors within the single Actuarial Studies degree may result in more
      UOC required for degree completion.

  - id: actuarial-major-plus-other
    kind: info
    text: >-
      Students completing an Actuarial Studies major and an additional major/minor will result in more
      UOC required for degree completion.

  - id: free-electives
    kind: pool
    role: free_elective
    title: Free Electives
    from: any and not GEN*****
    uoc: 36
    overflow: true
    original: >-
      Student must complete 36 UOC of the following courses. These courses can be any courses offered by
      the UNSW Business School or not offered by the UNSW Business School, but cannot start with GEN#.
      Please be mindful of the Level 1 limit when selecting Free Electives.
    note: >-
      Recommended (not required): a Work-Integrated Learning course as a Free Elective, e.g. COMM2244,
      COMM3020, COMM2222, COMM2233.

  - id: gen-ed
    kind: pool
    role: gen_ed
    title: General Education
    from: "@business_gen_ed"
    uoc: 12
    original: >-
      Students must complete 12 UOC of any course not offered by UNSW Business School. The following
      courses cannot count towards this requirement: GENL2021, GENL2032. (Rule: any General Education course.)
    note: Same reading as 3502 (intersection of "not Business School" and "any General Education course").

  - id: business-minimum
    kind: limit
    title: Minimum Business School UOC
    from: faculty:BUS
    uoc: { min: 96 }
    scope: root
    original: Students must complete a minimum of 96 UOC of UNSW Business School courses.

  - id: max-level-1
    kind: limit
    title: Maximum Level 1 UOC
    from: level:1 or GEN*****
    uoc: { max: 72 }
    scope: root
    original: >-
      Students may take a maximum of 72 UOC of Level 1 courses, including any GEN# courses (irrespective of
      their level).

substitutions:
  - replace: ACTL2131
    with: MATH2901 and MATH2931
    scope: level-2-core
    original: >-
      Students may replace ACTL2131 with the two courses MATH2901 Higher Theory of Statistics and MATH2931
      Higher Linear Models.
    note: >-
      "MATH2931 will be counted towards a major where this course is required or as a Business elective"
      is not modelled: under the and-alternative both courses are allocated to this core item.
  - replace: MATH1141
    with: MATH1151
    scope: other-spec
    original: >-
      A major in the School of Mathematics and Statistics comprises at least 60 UOC. Students may treat
      MATH1151 as equivalent to MATH1141, and MATH1251 as equivalent to MATH1241 for the purposes of
      completing major requirements.
  - replace: MATH1241
    with: MATH1251
    scope: other-spec
  # The same equivalence for the optional Actuarial Studies majors. MATHE1 (School of Mathematics and
  # Statistics) and COMPZ1 core MATH1131/MATH1231, which 3586 students do not take: without these a
  # 3586 student could complete those majors only by repeating first-year maths.
  - replace: MATH1131
    with: MATH1151
    scope: actuarial-major
    note: >-
      Interpretation (SPOT-CHECK 2026-10-10): the handbook's equivalence names MATH1141/MATH1241, the
      higher versions, while MATHE1/COMPZ1 core MATH1131/MATH1231; extending it to those is the
      reviewer's reading, not handbook text. COMPZ1 is a CSE major, so applying the School of Maths note
      to it is a further step. Confirm with the School of Risk and Actuarial Studies.
  - replace: MATH1231
    with: MATH1251
    scope: actuarial-major
  - replace: MATH1141
    with: MATH1151
    scope: actuarial-major
  - replace: MATH1241
    with: MATH1251
    scope: actuarial-major

shares:
  - between: [level-1-core, other-spec]
    courses: MATH1151 or MATH1251
    note: >-
      Interpretation: the "treat as equivalent for the purposes of completing major requirements" note
      implies the program-core MATH1151/MATH1251 also satisfy the MATH major's level 1 core.
  - between: [level-1-core, actuarial-major]
    courses: MATH1151 or MATH1251
    note: >-
      Same interpretation for the optional actuarial majors (MATHE1, COMPZ1): the program-core
      MATH1151/MATH1251 also satisfy the substituted MATH1131/MATH1231 major core items.
  - between: [level-2-core, spec:ACCTA1]
    courses: ACTL2111
    original: >-
      Students completing a Bachelor of Actuarial Studies can count ACTL2111 in both the Actuarial Studies
      program and accounting major. (ACCTA1 2026, Prescribed Electives)

notes:
  - "For single and related double degrees please see Progression Plan."
  - Progression rules are in accordance with university policy.
