           SOLA5052, SOLA5053, SOLA5056, SOLA5057]
    quotas:
      - from: not (AERO**** or MECH**** or MANF**** or MMAN****)
        count: { max: 2 }
        uoc: { max: 12 }
        note: At most 2 disciplinary electives (12 UOC) without an AERO, MECH, MANF or MMAN prefix can be taken.
    original: >-
      Students must take 12 UOC of the following courses. NOTE: - At most 2 disciplinary electives (12
      UOC) without an AERO, MECH, MANF or MMAN prefix can be taken. - Postgraduate courses and/or
      courses offered outside of the School may require manual enrolment. - 2 UOC and 3 UOC courses
      are run over consecutive terms for a final total of 6 UOC.
    note: >-
      The quota cannot bind inside a 12 UOC pool of 6 UOC courses but is kept as published. "Manual
      enrolment" is advisory and not modelled.

  - id: vip-consecutive
    kind: timing
    severity: warning
    courses: "@vip"
    consecutive: true
    original: 2 UOC and 3 UOC courses are run over consecutive terms for a final total of 6 UOC.
