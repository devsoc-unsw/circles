# Shared library for handbook year 2026: org codes, named course sets, program/spec groups.
# Sources: org names from the handbook course/program pages (e.g.
#   https://www.handbook.unsw.edu.au/undergraduate/programs/2026/3970 "Science Electives" list),
#   accessed 2026-10-08. Short org codes (ENG, SCI, BUS, CSE) are Circles-assigned identifiers;
#   handbook_id would hold the handbook's opaque org sys_id once resolved (not done here).
schema_version: "1.0"
kind: library
year: 2026
provenance:
  source: hand
  authors: [circles-schema-draft]
  status: partial
  note: Illustrative subset. A generated library would list every faculty and school.

faculties:
  ENG: { name: Faculty of Engineering }
  SCI: { name: Faculty of Science }
  BUS: { name: UNSW Business School }
  ADA: { name: "Faculty of Arts, Design & Architecture" }
  LAW: { name: Faculty of Law & Justice }
  MED: { name: Faculty of Medicine & Health }

schools:
  CSE: { name: School of Computer Science and Engineering, faculty: ENG }
  MATHS: { name: School of Mathematics and Statistics, faculty: SCI }
  # Handbook org sys_id from the 2026 CHEMA1 page (academic_org/school_detail); also one of the two
  # orgs excluded by 3805's General Education rule.
  CHEM: { name: School of Chemistry, faculty: SCI, handbook_id: 523a1d4f4f4d97404aa6eb4f0310c776 }
  # Not yet used: 3632 and 3959 approximate "School of Medical Sciences" by subject patterns; switching
  # them to school:SOMS changes the evaluated set and needs the catalogue's school data (SPOT-CHECK).
  SOMS: { name: School of Medical Sciences, faculty: MED }

sets:
  # The 28 "any <subject> course" rules under 3970 "Science Electives" (2026), as subject patterns.
  # "any Faculty of Science course" is the faculty atom.
  science_electives: >-
    faculty:SCI or FOOD**** or VISN**** or MATS**** or MSCI**** or DATA**** or GEOS**** or
    BIOT**** or BIOP**** or MICR**** or CLIM**** or CHEM**** or PHAR**** or BIOS**** or
    BIOC**** or ANAT**** or OPTM**** or BEES**** or SOMS**** or COMP**** or PHSL**** or
    NEUR**** or AVIA**** or BABS**** or MATH**** or PHYS**** or PATH**** or PSYC****
  # General Education courses (handbook cs_tags GE tag), excluding nothing; programs narrow it.
  gen_ed_any: gened
  # 2 UOC Vertically Integrated Project courses.
  vip: ENGG2600 or ENGG3600 or ENGG4600

  # --- Promoted from program/spec documents (SPOT-CHECK.md merge list, 2026-10-10). Each was diffed as a
  # course set against every local copy it replaces; the local copies are removed (no shadowing, §6.4).
  # Bachelor of Commerce (3502, 2026) and the BCom doubles 3764/3784.
  commerce_ify: COMM1100 or COMM1110 or COMM1120 or COMM1140 or COMM1150 or COMM1170 or COMM1180 or COMM1190
  business_wil: COMM2222 or COMM2233 or COMM2244 or COMM3020 or COMM3030 or COMM3060 or COMM3101 or COMM3202 or TABL3033
  non_business_wil: CDEV3000 or CDEV3001 or CDEV3012 or CDEV3100 or CDEV3200 or CDEV3300
  business_fys: >-
    COMM3900 or MGMT3004 or TABL3033 or COMM2233 or COMM2244 or COMM3000 or COMM3030 or COMM3060
    or COMM3090 or COMM3501 or COMM3020 or ACCT3583 or ACTL3192
  non_business_fys: CDEV3000 or CDEV3300 or CDEV3500
  # Business School programs' General Education (3502, 3543, 3586, 3979): any GE course not offered by the
  # Business School, except GENL2021 and GENL2032.
  business_gen_ed: gened and not (faculty:BUS or GENL2021 or GENL2032)
  # CSE majors' "Computing Elective(s)" (COMPA1, COMPD1, COMPI1, COMPN1, COMPS1, COMPY1; not COMPJ1).
  cse_computing_electives: COMP2041 or COMP2111 or @vip or COMP3*** or COMP4*** or COMP6*** or COMP9***
  # 8543 Master of IT "Electives" list shared by COMPLS/COMPNS/COMPOS (and COMPXS plus COMP6420; COMPMS DKE).
  mit_electives: >-
    COMP4121 or COMP4128 or COMP4141 or COMP4161 or COMP4418 or COMP4511 or COMP6080 or COMP6131 or
    COMP6441 or COMP6443 or COMP6445 or COMP6447 or COMP6448 or COMP6451 or COMP6452 or COMP6453 or
    COMP6713 or COMP6714 or COMP6721 or COMP6733 or COMP6741 or COMP6752 or COMP6771 or COMP6841 or
    COMP6843 or COMP6845 or COMP6991 or COMP9032 or COMP9044 or COMP9101 or COMP9102 or COMP9153 or
    COMP9154 or COMP9164 or COMP9201 or COMP9211 or COMP9222 or COMP9242 or COMP9243 or COMP9283 or
    COMP9312 or COMP9313 or COMP9315 or COMP9319 or COMP9321 or COMP9332 or COMP9333 or COMP9334 or
    COMP9336 or COMP9337 or COMP9414 or COMP9415 or COMP9417 or COMP9418 or COMP9434 or COMP9444 or
    COMP9447 or COMP9491 or COMP9511 or COMP9517 or COMP9727 or COMP9814 or COMP9920 or GSOE9210 or
    GSOE9220 or MATH5836 or MATH5845 or MATH5855 or MATH5905 or MATH5960
  # 3962 "at least 24 UOC of Level 1 Science" subject list (use with level:1). 3956's list omits BIOP/SOMS
